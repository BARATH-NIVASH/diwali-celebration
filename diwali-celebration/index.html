<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ஒளி பிறக்கட்டும் - Diwali 3D Celebration</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js and Postprocessing CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040208;
      font-family: 'Noto Serif Tamil', serif;
      color: #fce7b0;
    }
    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    .pulse-glow {
      animation: pulseGlow 2.6s ease-in-out infinite;
    }
    #festive-frame-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      transform: scale(0.65);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease;
    }
    #festive-frame-container.frame-visible {
      transform: scale(1);
    }
    .diwali-ornate-frame {
      position: relative;
      padding: 12px;
      border-radius: 24px;
      background: linear-gradient(135deg, #f59e0b, #b45309, #fde68a, #78350f, #d97706);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.6), 0 25px 60px rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(254, 240, 138, 0.85);
    }
    .diwali-frame-inner {
      position: relative;
      width: 620px;
      height: 350px;
      max-width: 90vw;
      max-height: 52vh;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #06040a;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }
    #reel-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body class="relative w-full h-full cursor-pointer overflow-hidden">

  <!-- Main 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Ambient Pulsing Tap Hint across all screens -->
  <div id="tap-hint-container" class="absolute bottom-6 inset-x-0 z-20 flex justify-center items-center pointer-events-none transition-opacity duration-700">
    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-black/40 backdrop-blur-md border border-amber-400/30 shadow-[0_0_15px_rgba(245,158,11,0.25)] text-amber-200/90 text-xs sm:text-sm tracking-wide pulse-glow select-none">
      <span class="animate-bounce inline-block text-sm">👆</span>
      <span id="tap-hint-text">தொடர திரையைத் தொடவும்</span>
    </div>
  </div>

  <!-- Ornate Golden Video Frame in Finale (Screen 5) -->
  <div id="finale-greeting-container" class="absolute inset-0 z-30 flex items-center justify-center p-4 pointer-events-none opacity-0 transition-opacity duration-1000">
    <div id="festive-frame-container" class="pointer-events-auto flex items-center justify-center m-auto">
      <div class="diwali-ornate-frame">
        <div class="absolute -top-3.5 -left-3.5 text-xl select-none filter drop-shadow">🪔</div>
        <div class="absolute -top-3.5 -right-3.5 text-xl select-none filter drop-shadow">🪔</div>
        <div class="absolute -bottom-3.5 -left-3.5 text-xl select-none filter drop-shadow">🪔</div>
        <div class="absolute -bottom-3.5 -right-3.5 text-xl select-none filter drop-shadow">🪔</div>

        <div class="diwali-frame-inner flex items-center justify-center">
          <video id="reel-player" class="w-full h-full object-cover" playsinline loop controls autoplay muted>
            <source src="Happy-Diwali-SnapYT.App(1).mp4" type="video/mp4">
            <source src="diwali-reel.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STATE = {
      started: false,
      currentScreen: 1,
      totalScreens: 5,
      isTransitioning: false,
      pixelRatio: Math.min(window.devicePixelRatio, 2),
      width: window.innerWidth,
      height: window.innerHeight
    };

    class DiwaliAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.initialized = false;
        this.melodicTimer = null;
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.75, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
        this.initialized = true;
        this.startKalyaniTanpura();
        this.startFestiveCarnaticMelody();
      }

      startFestiveCarnaticMelody() {
        const ragaNotes = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99];
        let step = 0;
        const melodyLoop = () => {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          const f = ragaNotes[(step * 2 + Math.floor(Math.random() * 3)) % ragaNotes.length];
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.024, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + 0.48);

          step++;
          this.melodicTimer = setTimeout(melodyLoop, 320 + Math.random() * 180);
        };
        melodyLoop();
      }

      startKalyaniTanpura() {
        if (!this.ctx) return;
        const freqs = [146.83, 183.54, 220.00, 293.66];
        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          lfo.frequency.setValueAtTime(0.12 + idx * 0.05, this.ctx.currentTime);
          lfoGain.gain.setValueAtTime(0.015, this.ctx.currentTime);
          lfo.connect(lfoGain);
          lfoGain.connect(gain.gain);
          lfo.start();

          gain.gain.setValueAtTime(0.03 / (idx + 1), this.ctx.currentTime);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
        });
      }

      playDiyaIgnite(pitch = 1.0) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(1100 * pitch, now + 0.18);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.55);
      }

      playCrackerPop(intensity = 1.0) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.045;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1600 + Math.random() * 2000, now);
        filter.Q.setValueAtTime(2.2, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.38 * intensity, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.frequency.setValueAtTime(130 + Math.random() * 80, now);
        sub.frequency.exponentialRampToValueAtTime(32, now + 0.055);
        subGain.gain.setValueAtTime(0.28 * intensity, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        sub.connect(subGain);
        subGain.connect(this.masterGain);

        noise.start(now);
        sub.start(now);
        sub.stop(now + 0.06);
      }

      playAutoBombBoom() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(22, now + 1.4);
        oscGain.gain.setValueAtTime(0.95, now);
        oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

        const dur = 0.85;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(850, now);
        filter.frequency.exponentialRampToValueAtTime(70, now + 1.5);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.85, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        osc.connect(oscGain);
        oscGain.connect(this.masterGain);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.masterGain);

        osc.start(now);
        noise.start(now);
        osc.stop(now + 2.6);
      }

      playFountainHiss(dur = 3.0) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const src = this.ctx.createBufferSource();
        src.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2200, now);
        filter.frequency.linearRampToValueAtTime(4500, now + dur * 0.7);
        filter.Q.setValueAtTime(1.6, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        src.start(now);
      }

      playChakkaramWhine(dur = 3.5) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(560, now + 0.5);
        osc.frequency.linearRampToValueAtTime(140, now + dur);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + dur);
      }

      playRocketFlight() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(2800, now + 0.85);

        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.65);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.95);
      }

      playNadaswaramFlourish() {
        if (!this.ctx) return;
        const notes = [
          { f: 587.33, d: 0.3 },
          { f: 659.25, d: 0.25 },
          { f: 73
